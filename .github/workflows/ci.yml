name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  starter:
    name: Starter (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      # placeholders - required at build time
      PUBLIC_SUPABASE_URL: https://example.supabase.co
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run setup -- --yes --app-id com.example.cistarter --app-name "CI Starter" --package-name ci-starter
      - name: Verify repeated setup
        run: npm run setup -- --yes
      - run: npm test
      - run: npm run check
      - run: npm run build
      - name: Sync Android assets and plugins
        run: npm run android:sync
      - name: Sync iOS assets and plugins
        if: runner.os == 'macOS'
        run: npm run ios:sync
